    <script>
        // === 1. KONFIGURASI API LM STUDIO & NGROK ===
        // PENTING: Selalu perbarui URL Ngrok di bawah jika Anda merestart terminal Ngrok di PC utama
        const NGROK_URL = "https://spray-blaspheme-rabid.ngrok-free.dev/v1/chat/completions";
        const MODEL_NAME = "qwen2.5-coder-14b";

        // === 2. KONFIGURASI DATA LOG GOOGLE FORM ===
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSetlRxWs5sjk6vgNrz3W_n4F7nuY43_zRag9vOseku_MQl0Dw/formResponse"; 
        const ENTRY_IDENTITY = "entry.1269873124";
        const ENTRY_PROMPT = "entry.1925079271";   
        const ENTRY_RESPONSE = "entry.527648995"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Fungsi otomatis menangkap IP publik, detail lokasi/ISP, dan sistem operasi/perangkat
        async function getDeviceIdentity() {
            let detailIdentity = "Identitas Tidak Terdeteksi";
            try {
                // Menggunakan ip-api.com untuk mendapatkan Geo-IP (Kota, Negara, ISP) sekaligus
                const res = await fetch("http://ip-api.com/json/");
                const data = await res.json();
                if(data.status === "success") {
                    detailIdentity = `[${data.query}] - ${data.city}, ${data.regionName} (${data.isp})`;
                } else {
                    // Fallback ke ipify jika ip-api gagal
                    const resIpify = await fetch("https://api.ipify.org?format=json");
                    const dataIpify = await resIpify.json();
                    detailIdentity = `[${dataIpify.ip}]`;
                }
            } catch (e) {
                console.log("Gagal mengambil data Geo-IP (Mungkin diblokir adblocker):", e);
            }

            const ua = navigator.userAgent;
            let os = "OS Lainnya";
            let deviceType = "Desktop/PC";

            if (ua.indexOf("Win") !== -1) os = "Windows";
            if (ua.indexOf("Mac") !== -1) os = "macOS";
            if (ua.indexOf("Linux") !== -1) os = "Linux";
            if (ua.indexOf("Android") !== -1) os = "Android";
            if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            if (isMobile) {
                deviceType = ua.indexOf("iPad") !== -1 ? "Tablet" : "Smartphone";
            }

            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            return `${detailIdentity} - ${deviceType} (${os}) - TZ: ${timeZone}`;
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const innerDiv = document.createElement('div');
            innerDiv.className = sender === 'user' 
                ? 'bg-orange-500 text-white p-4 rounded-3xl rounded-br-none max-w-[85%] whitespace-pre-wrap shadow-lg font-medium' 
                : 'bg-white text-gray-900 p-4 rounded-3xl rounded-bl-none max-w-[85%] whitespace-pre-wrap shadow-xl border border-gray-100';
            
            if (sender === 'ai') {
                const aiName = document.createElement('span');
                aiName.className = "text-orange-600 font-bold text-xs mb-1 block";
                aiName.textContent = "Day One AI: ";
                innerDiv.appendChild(aiName);
            }
            
            const textContainer = document.createElement('span');
            textContainer.textContent = text;
            innerDiv.appendChild(textContainer);
            
            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Fungsi menyetor log chat dan identitas terperinci ke Google Sheets secara background
        async function logChatToSheets(promptText, responseText) {
