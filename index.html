<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Web UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-teal-400">Day One AI Interface</h1>
        <span class="text-xs bg-green-900 text-green-300 px-2 py-1 rounded-full border border-green-700">Connected via Ngrok</span>
    </header>

    <!-- Chat Container -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
        <!-- Selamat Datang -->
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
            <p class="text-teal-400 font-semibold mb-1">Qwen 2.5 Coder 14B Ready.</p>
            <p class="text-sm text-gray-400">Ketik instruksi pemrograman atau pertanyaan logika Anda di bawah.</p>
        </div>
    </div>

    <!-- Input Area -->
    <footer class="p-4 bg-gray-800 border-t border-gray-700">
        <div class="max-w-4xl mx-auto flex gap-2">
            <textarea id="user-input" rows="2" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg p-2 text-white placeholder-gray-400 focus:outline-none focus:border-teal-500 resize-none" placeholder="Tulis instruksi coding di sini... (Tekan Ctrl+Enter untuk kirim)"></textarea>
            <button id="send-btn" class="bg-teal-600 hover:bg-teal-500 text-white px-6 font-medium rounded-lg transition-colors">Kirim</button>
        </div>
    </footer>

    <script>
        // MASUKKAN URL NGROK AKTIF ANDA DI SINI
        const NGROK_URL = "https://spray-blaspheme-rabid.ngrok-free.dev/v1/chat/completions";
        const MODEL_NAME = "qwen2.5-coder-14b";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const innerDiv = document.createElement('div');
            innerDiv.className = sender === 'user' 
                ? 'bg-teal-700 text-white p-3 rounded-lg max-w-[80%] whitespace-pre-wrap shadow-md' 
                : 'bg-gray-800 text-gray-100 p-3 rounded-lg max-w-[80%] whitespace-pre-wrap shadow-md border border-gray-700';
            
            innerDiv.textContent = text;
            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // Loading state
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'text-sm text-gray-500 italic';
            loadingDiv.textContent = 'AI sedang berpikir...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(NGROK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer lm-studio' // Sesuaikan jika Anda memakai API Key khusus
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [{ role: "user", content: text }],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                chatBox.removeChild(loadingDiv);

                if (data.choices && data.choices[0].message) {
                    appendMessage('ai', data.choices[0].message.content);
                } else {
                    appendMessage('system-error', 'Format respons tidak dikenali.');
                }
            } catch (error) {
                chatBox.removeChild(loadingDiv);
                appendMessage('system-error', `Gagal terhubung ke PC: ${error.message}`);
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
