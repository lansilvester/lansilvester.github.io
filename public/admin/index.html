<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Panel — Portfolio Alan</title>
  <link rel="icon" type="image/webp" href="/images/uploads/alan-profile-2.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Tema kustom untuk Decap CMS (selektor diarahkan ke class Decap 3.x, lihat admin.css) -->
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Decap CMS admin. Konfigurasi ada di /admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.11.0/dist/decap-cms.js"></script>
  <script>
    // Pratinjau editor mengikuti gaya situs (lihat /admin/preview.css).
    window.CMS.registerPreviewStyle('/admin/preview.css')

    // Pratinjau khusus untuk koleksi blog: tampilkan judul/meta sebelum body.
    if (typeof window.React !== 'undefined') {
      window.CMS.registerPreviewTemplate('blog', function ({ entry, widgetFor }) {
        var React = window.React
        var data = entry.get('data')
        return React.createElement(
          'article',
          { className: 'decap-blog' },
          React.createElement('h1', null, data.get('title')),
          React.createElement('p', { className: 'decap-meta' }, data.get('date')),
          data.get('excerpt')
            ? React.createElement('blockquote', null, data.get('excerpt'))
            : null,
          React.createElement('hr', null),
          widgetFor('body')
        )
      })
    }
  </script>
</body>
</html>
